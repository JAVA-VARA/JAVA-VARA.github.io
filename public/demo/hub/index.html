<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로컬 허브 데모</title>
<script src="scripts/theme.js"></script>
<style>
  :root { color-scheme: light; --bg: #f4f7f8; --card: #fff; --text: #173044;
          --muted: #586f78; --line: #d8e1e7; --ok: #11786f; }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #111418; --card: #1b2026;
          --text: #e6e8ec; --muted: #a5adb6; --line: #343b44; --ok: #7fd4bd; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { display: grid; grid-template: 48px minmax(0, 1fr) / 208px minmax(0, 1fr);
         background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, "Malgun Gothic", sans-serif; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;
           min-width: 0; padding: 0 12px; background: var(--card); border-bottom: 1px solid var(--line); }
  #menu { align-self: flex-end; width: 30px; height: 30px; margin-bottom: 4px; padding: 0;
          border: 1px solid var(--line); border-radius: 6px;
          background: var(--bg); color: var(--text); font: inherit; cursor: pointer; }
  header strong { font-size: 14px; }
  #theme { margin-left: auto; padding: 5px 9px; border: 1px solid var(--line);
           border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; cursor: pointer; }
  #menu:focus-visible, #theme:focus-visible, nav a:focus-visible, nav summary:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  nav { grid-row: 2; display: flex; flex-direction: column; gap: 3px; min-width: 0;
        padding: 8px; background: var(--card); border-right: 1px solid var(--line); overflow-y: auto; }
  nav h2 { margin: 10px 6px 4px; color: var(--muted); font-size: 12px; font-weight: 700; }
  nav summary { padding: 6px 10px; cursor: pointer; font-weight: 700; }
  nav a { display: block; color: var(--muted); text-decoration: none; padding: 8px 10px;
          margin-left: 12px; border-radius: 6px; }
  nav details a { margin-left: 24px; }
  nav a:hover, nav a[aria-current="page"] { color: var(--text); background: var(--bg); }
  nav a[aria-current="page"] { color: var(--ok); font-weight: 700; }
  iframe { grid-row: 2; grid-column: 2; width: 100%; height: 100%; min-width: 0; min-height: 0;
           border: 0; background: var(--bg); }
  body.sidebar-hidden { grid-template-columns: 40px minmax(0, 1fr); }
  body.sidebar-hidden nav { gap: 0; padding: 8px 5px; overflow: hidden; }
  body.sidebar-hidden nav section { display: none; }
  body.sidebar-hidden iframe { grid-column: 2; }
  @media (max-width: 640px) {
    body { grid-template-columns: 176px minmax(0, 1fr); }
    body.sidebar-hidden { grid-template-columns: 40px minmax(0, 1fr); }
    nav { padding-inline: 6px; }
  }
</style>
</head>
<body>
<header>
  <strong>로컬 허브</strong><span style="color:var(--muted);font-size:13px">합성 데이터 데모</span>
  <button id="theme" type="button" aria-label="다크 모드로 전환">다크 모드</button>
</header>
<nav aria-label="페이지">
  <button id="menu" type="button" aria-label="사이드바 접기" aria-expanded="true">≪</button>
  <section aria-labelledby="projects-title">
    <h2 id="projects-title">프로젝트</h2>
    <details open data-project="clinical">
      <summary>임상 연구 자동화</summary>
      <a href="#definitions" data-tab="definitions" data-page="docs/VARIABLE_DEFINITIONS.html">변수 정의서</a>
      <a href="#review" data-tab="review" data-page="review/">검토 항목</a>
      <a href="#chart" data-tab="chart" data-page="chart/">차트 검토</a>
      <a href="#llm" data-tab="llm" data-page="llm/">LLM REVIEW</a>
      <a href="#decisions" data-tab="decisions" data-page="decisions/">판단 대기열</a>
      <a href="#sessions" data-tab="sessions" data-page="sessions/">세션 현황</a>
      <a href="#workflow" data-tab="workflow" data-page="docs/EXTRACTION_WORKFLOW.html">워크플로우</a>
      <a href="#code-overview" data-tab="code-overview" data-page="docs/CODE_OVERVIEW.html">코드 구조</a>
    </details>
  </section>
</nav>
<iframe id="content" title="판단 대기열" src="decisions/"></iframe>
<script>
  const tabs = document.querySelectorAll('nav [data-tab]');
  const pages = Object.fromEntries(Array.from(tabs, tab =>
    [tab.dataset.tab, [tab.dataset.page, tab.textContent.trim()]]));
  const projects = document.querySelectorAll('details[data-project]');
  let collapsed = {};
  try { collapsed = JSON.parse(localStorage.getItem('kqips-hub-collapsed')) || {}; } catch {}
  for (const project of projects) {
    project.open = collapsed[project.dataset.project] !== true;
    project.addEventListener('toggle', () => {
      collapsed[project.dataset.project] = !project.open;
      try { localStorage.setItem('kqips-hub-collapsed', JSON.stringify(collapsed)); } catch {}
    });
  }
  const themeButton = document.querySelector('#theme');
  const frame = document.querySelector('#content');
  function broadcastTheme() {
    frame.contentWindow?.postMessage({type: 'kqips-theme', value: document.documentElement.dataset.theme}, location.origin);
  }
  function updateThemeButton() {
    const dark = document.documentElement.dataset.theme === 'dark';
    themeButton.textContent = dark ? '일반 모드' : '다크 모드';
    themeButton.setAttribute('aria-label', `${themeButton.textContent}로 전환`);
  }
  themeButton.addEventListener('click', () => {
    window.kqipsTheme.set(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    broadcastTheme();
    updateThemeButton();
  });
  addEventListener('storage', updateThemeButton);
  updateThemeButton();
  const menuButton = document.querySelector('#menu');
  menuButton.addEventListener('click', () => {
    const hidden = document.body.classList.toggle('sidebar-hidden');
    menuButton.setAttribute('aria-expanded', String(!hidden));
    menuButton.setAttribute('aria-label', hidden ? '사이드바 펼치기' : '사이드바 접기');
    menuButton.textContent = hidden ? '≫' : '≪';
  });
  function selectTab() {
    const key = location.hash.slice(1);
    const current = Object.hasOwn(pages, key) ? key : 'chart';
    if (current !== key) history.replaceState(null, '', '#chart');
    const [url, title] = pages[current];
    if (frame.getAttribute('src') !== url) frame.setAttribute('src', url);
    frame.title = title;
    for (const tab of tabs) {
      if (tab.dataset.tab === current) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    }
  }
  frame.addEventListener('load', broadcastTheme);
  addEventListener('hashchange', selectTab);
  selectTab();
</script>
</body>
</html>
